<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Учебный помощник</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
      color: #1f2328;
      background: #f5f6f8;
    }
    main {
      max-width: 640px;
      margin: 64px auto;
      padding: 32px;
      background: #fff;
      border-radius: 12px;
    }
    h1 { margin-top: 0; }
    .button {
      display: inline-block;
      padding: 12px 20px;
      border-radius: 8px;
      background: #0077ff;
      color: #fff;
      text-decoration: none;
      font-weight: 600;
    }
    code { background: #f0f1f3; padding: 2px 6px; border-radius: 4px; }
  </style>
</head>
<body>
  <main>
    <h1>Учебный помощник</h1>
    <p>
      Бот подскажет расписание занятий вашей группы. Напишите ему прямо здесь:
      нажмите на значок сообщений в правом нижнем углу страницы.
    </p>
    <p>Или откройте диалог во ВКонтакте — в браузере или в приложении на телефоне:</p>
    <p><a class="button" href="https://vk.me/club{{GROUP_ID}}" target="_blank" rel="noopener">Написать боту во ВКонтакте</a></p>
    <p>Команды: <code>/start</code>, <code>/help</code>, <code>/schedule</code>.</p>
  </main>

  <!-- Виджет «Сообщения сообщества» ВКонтакте -->
  <script src="https://vk.com/js/api/openapi.js?169"></script>
  <div id="vk_community_messages"></div>
  <script>
    VK.Widgets.CommunityMessages("vk_community_messages", {{GROUP_ID}}, {
      tooltipButtonText: "Спросить расписание"
    });
  </script>
</body>
</html>
